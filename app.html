<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App — LumoPay</title>
<meta name="description" content="LumoPay mobile app screen. Fictional wallet, sample data only.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="dash.css">
</head>
<body style="background:#e9e6df">
<div class="app-shell">
  <div class="app-top">
    <span class="avatar-c" aria-label="Profile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a2d82" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg></span>
    <span class="sp">
      <button class="app-ic" aria-label="Rewards"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a2 2 0 0 0 2 5h1M17 6h3a2 2 0 0 1-2 5h-1"/></svg></button>
      <button class="app-ic" aria-label="Scan to pay"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M3 12h18"/></svg></button>
    </span>
  </div>

  
  <div class="tiles">
    <div class="tile">
      <svg class="t-ic" width="36" height="28" viewBox="0 0 34 26" aria-hidden="true"><circle cx="12" cy="13" r="10" fill="#0070e0"/><circle cx="23" cy="13" r="10" fill="#003087" fill-opacity=".82"/></svg>
      <p>Money on hold</p>
      <p class="t-amt">$86.20</p>
    </div>
    <div class="tile">
      <svg class="t-ic" width="36" height="28" viewBox="0 0 34 26" aria-hidden="true"><circle cx="12" cy="13" r="10" fill="#0070e0"/><circle cx="23" cy="13" r="10" fill="#003087" fill-opacity=".82"/></svg>
      <p>LumoPay balance</p>
      <p class="t-amt" data-balance>$1,248.60</p>
      <a class="t-link" href="wallet.html">Transfer</a>
    </div>
  </div>

  <a class="setup" href="app.html" aria-label="Account setup, 3 of 5 completed">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="#d7e0ea" stroke-width="4"/><path d="M20 4a16 16 0 1 1-11.3 27.3" fill="none" stroke="#0070e0" stroke-width="4" stroke-linecap="round"/></svg>
    <span><b>Set up your account</b><small>3 of 5 completed.</small></span>
    <svg class="arr" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>

  <h2 class="app-h">Send again</h2>
  <div class="again-app">
    <a href="send.html"><span class="circ"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#003087" stroke-width="2" aria-hidden="true"><path d="M3 9l1.7-5h14.6L21 9M3 9h18M3 9v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9M9 20v-6h6v6"/></svg></span>Marlow S…</a>
    <a href="send.html"><span class="circ"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#003087" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>Search</a>
  </div>

  <div class="send-row">
    <a href="send.html">Send</a>
    <a href="send.html">Request</a>
  </div>

  <nav class="bottom-nav" aria-label="App">
    <a href="app.html" class="active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-8 9 8M5 9.5V21h14V9.5"/></svg>Home</a>
    <a href="activity.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Finances</a>
    <a href="send.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 8l-4 4 4 4M3 12h13M17 8l4 4-4 4M21 12H8"/></svg>Payments</a>
    <a href="dashboard.html#deals"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3h8l9 9-8 8-9-9z"/><circle cx="8" cy="8" r="1.6"/></svg>Deals</a>
    <a href="wallet.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2M3 7v10a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14" r="1.3"/></svg>Wallet</a>
  </nav>
</div>
<script src="dash.js"></script>
</body>
</html>
